<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Create Exam Session</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Base JS (includes theme restoration) -->
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/faculty_new_session.css') }}" />
</head>
<body>
    <!-- 🔵 DARK MODE SWITCH ABOVE FORM -->
    <div class="toggle-container">
        <div class="toggle-btn" onclick="toggleDarkMode()">
            <div class="toggle-circle"></div>
        </div>
    </div>

    <div class="panel">
        <h1>Create Exam Session</h1>

        <!-- PRESERVED FLASH MESSAGE FUNCTION -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="messages">
                    {% for c,m in messages %}
                        <li><strong>{{ c }}:</strong> {{ m }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <!-- PRESERVED FORM EXACTLY AS GIVEN -->
        <form method="post" action="{{ url_for('faculty_new_session') }}">
            <label>Exam
                <select name="exam_id" required>
                    <option value="" disabled selected>Choose exam…</option>
                    {% for e in exams %}
                        <option value="{{ e.id }}">{{ e.exam_code }}</option>
                    {% endfor %}
                </select>
            </label>

            <label>Location
                <select name="location_id" required>
                    <option value="" disabled selected>Choose location…</option>
                    {% for l in locations %}
                        <option value="{{ l.id }}">{{ l.campus_name }} – {{ l.building_name }} {{ l.room_number }}</option>
                    {% endfor %}
                </select>
            </label>

            <div class="row">
                <label>Date
                    <input type="date" name="date" required>
                </label>
                <label>Start time
                    <input type="time" name="time" required>
                </label>
            </div>

            <div class="row">
                <label>Capacity
                    <input type="number" name="capacity" min="1" value="20" required>
                </label>
                <label>Duration (minutes)
                    <input type="number" name="duration_minutes" min="15" step="5" value="90" required>
                </label>
            </div>

            <div style="margin-top:4rem;">
                <button type="submit" class="btn">Create</button>
                <a class="btn" href="{{ url_for('faculty_portal') }}">Back</a>
            </div>
        </form>
    </div>
</body>
</html>
