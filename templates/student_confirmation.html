<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Registration Confirmed</title>
  <!-- Responsive scaling for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Preconnect to Google Fonts CDN for faster font loading -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <!-- Load Inter font: weights 400, 500, 600, 700 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Load base.js: restores saved theme, provides toggleDarkMode() -->
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>

  <!-- Load global + page-specific styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/student_confirmation.css') }}" />
</head>
<body>

  <!-- Dark mode toggle switch (top-right) -->
  <div class="toggle-container">
    <div class="toggle-btn" onclick="toggleDarkMode()">
      <div class="toggle-circle"></div>
    </div>
  </div>

  <!-- Page headline: success confirmation -->
  <h1>You're enrolled!</h1>

  <!-- Success message card -->
  <div class="card success-card">
    <!-- Short confirmation message -->
    <p>Your exam appointment has been successfully registered. It will now appear on your dashboard calendar.</p>
  </div>

  <!-- Actions: primary navigation after confirmation -->
  <div class="actions">
    <!-- Link to student_dashboard route -->
    <a class="btn" href="{{ url_for('student_dashboard') }}">Back to Dashboard</a>
    <!-- Link to student_history route -->
    <a class="btn" href="{{ url_for('student_history') }}">View Appointment History</a>
  </div>

</body>
</html>
