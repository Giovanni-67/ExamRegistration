<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Tell the browser what characters are allowed -->
  <meta charset="utf-8" />
  <!-- Title shown on the browser tab -->
  <title>Sign Up</title>
  <!-- Make the page scale correctly on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Speed up loading the Google font -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <!-- Use the Inter font (regular to bold) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- This file remembers dark/light mode and enables the toggle -->
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>

  <!-- Shared styles used by many pages -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <!-- Styles only for the signup page -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}" />
</head>
<body>

  <!-- Dark/light mode switch (top-right) -->
  <div class="toggle-container">
    <div class="toggle-btn" onclick="toggleDarkMode()">
      <div class="toggle-circle"></div>
    </div>
  </div>

  <!-- Main white box that holds the form -->
  <div class="panel signup-card">
    <!-- Big page headline -->
    <h1>Create account</h1>

    <!-- Show short messages like "success" or "error" -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="messages">
          {% for c, m in messages %}
            <!-- Example: Success: Your account was created -->
            <li><strong>{{ c }}:</strong> {{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <!-- The form sends your info to the server -->
    <form method="post" action="{{ url_for('signup') }}">

      <!-- Full name input -->
      <label>
        Full name
        <input name="full_name" required />
      </label>

      <!-- Email input (student or faculty formats) -->
      <label>
        Email
        <input
          type="text"
          name="email"
          required
          pattern="^\d{10}@student\.csn\.edu$|^[A-Za-z]+\.[A-Za-z]+@csn\.edu$"
          title="Student: 10digits@student.csn.edu  |  Faculty: firstname.lastname@csn.edu" />
      </label>

      <!-- Password input (student or faculty rules) -->
      <label>
        Password
        <input
          type="password"
          name="password"
          required
          pattern="^\d{10}$|^.{7,}$"
          title="Student: exactly 10 digits (your NSHE). Faculty: at least 7+ characters." />
      </label>

      <!-- Confirm password input -->
      <label>
        Confirm
        <input
          type="password"
          name="confirm"
          required
          pattern="^\d{10}$|^.{7,}$"
          title="Re-enter the same password." />
      </label>

      <!-- Choose whether you are a student or faculty -->
      <fieldset>
        <!-- Small title for the role group -->
        <legend>Role</legend>
        <!-- Student option (default) -->
        <label class="inline-option"><input type="radio" name="role" value="student" checked /> Student</label>
        <!-- Faculty option -->
        <label class="inline-option"><input type="radio" name="role" value="faculty" /> Faculty</label>
      </fieldset>

      <!-- Buttons at the bottom -->
      <div class="form-actions">
        <!-- Create account button -->
        <button type="submit" class="btn">Create Account</button>
        <!-- Link to the login page -->
        <a class="btn" href="{{ url_for('login') }}">Have an account? Log in</a>
      </div>

    </form>
  </div>

</body>
</html>
