<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Load base.js: restores saved theme, provides toggleDarkMode() -->
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>

  <!-- Load page-specific styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>

<body>

  <!-- CSN Header with logo, title, and dark mode toggle -->
  <div class="csn-header">
      <!-- Logo badge: CSN initials on gold background -->
      <div class="csn-logo">CSN</div>
      <div>Exam Registration System</div>
      <!-- Toggle switch: calls toggleDarkMode() from base.js -->
      <div class="toggle-btn" onclick="toggleDarkMode()">
          <div class="toggle-circle"></div>
      </div>
  </div>

  <!-- Login card: centered form container -->
  <div class="login-card">

    <h1>Login</h1>

    <!-- Flash messages from Flask: displays list of (category, message) tuples -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for c,m in messages %}
            <!-- c: string (category like 'success', 'error'), m: string (message text) -->
            <li><strong>{{ c|capitalize }}:</strong> {{ m }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <!-- Login form: submits POST to login route, returns email and password -->
    <form method="post" action="{{ url_for('login') }}">
      <label>Email</label>
      <!-- Email input: validates student (10digits@student.csn.edu) or faculty (firstname.lastname@csn.edu) format -->
      <input
        type="text"
        name="email"
        required
        pattern="^\d{10}@student\.csn\.edu$|^[A-Za-z]+\.[A-Za-z]+@csn\.edu$"
        title="Student: 10digits@student.csn.edu  |  Faculty: firstname.lastname@csn.edu"
      /><br />

      <label>Password</label>
      <!-- Password input: returns plain text password -->
      <input type="password" name="password" required /><br />

      <!-- Submit button: sends form data to login route -->
      <button type="submit">Login</button>
    </form>

    <!-- Link to signup route -->
    <p><a href="{{ url_for('signup') }}">Create an account</a></p>

  </div>

</body>
</html>
