<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} - Exam Registration</title>
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
</head>
<body>
  <div class="error-page">
    <div class="toggle-container">
      <button class="toggle-btn" type="button" onclick="toggleDarkMode()" aria-label="Toggle dark mode">
        <span class="toggle-circle" aria-hidden="true"></span>
      </button>
    </div>
    <!-- Explain what happened without showing technical or private details. -->
    <main class="panel error-card">
      <p class="error-code">Exam Registration &middot; {{ status }}</p>
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <a class="btn" href="{{ url_for('home') }}">Return to home</a>
    </main>
  </div>
</body>
</html>
